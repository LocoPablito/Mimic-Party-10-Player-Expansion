name: v0.2.3 compatibility package
on:
  push:
    branches: ['release/v0.2.3-compat']
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: LocoPablito/MimicParty-Modding
          ref: 124cb4e1344a8ee192fe41d5616c43e4bb670aa0
          path: _deps/MimicParty-Modding
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.425'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile Expansion 1.1.3
        shell: pwsh
        run: ./build.ps1
      - name: Assemble Expansion 1.1.3 R1 candidate
        shell: pwsh
        run: |
          python scripts/package_release.py
          if ($LASTEXITCODE -ne 0) { throw 'Archive verification failed' }
      - uses: actions/upload-artifact@v6
        with:
          name: ten-player-v113-r1-candidate
          path: dist/
          retention-days: 14
